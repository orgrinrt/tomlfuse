[package]
name = "tomlfuse"
version = "0.0.5"
edition = "2021"
# globset 0.4.20 is a direct dependency and declares 1.88, so nothing below that can build this
# crate however old its own source is. 1.73 was a claim consumers could not act on.
rust-version = "1.88.0"
authors = ["orgrinrt", "Hiisi Digital"]  # read by this crate's own fixtures
description = """
Bind toml fields into properly typed build-time constants with flexible patterns and hierarchies.
"""
# SPDX rather than a file reference: crates.io shows no identifier for `license-file`, so
# licence scanners see nothing. The LICENSE file is the same MPL-2.0 text.
license = "MPL-2.0"
readme = "README.md"
keywords = ["toml", "build-time", "constant", "proc-macro"]
exclude = [".idea/", "target/"]
categories = ["development-tools", "config"]
documentation = "https://docs.rs/tomlfuse"
homepage = "https://github.com/orgrinrt/tomlfuse"
repository = "https://github.com/orgrinrt/tomlfuse"

[workspace]
members = []

[workspace.metadata]
# Read by tests/integration_test_workspace.rs, which had no workspace to read before this.
purpose = "exercising the workspace! macro"
count = 3

[badges]
maintenance = { status = "actively-developed" }

[features]
default = []
# What a `package!`, `workspace!` or `file!` invocation expands into names nothing outside
# `core`. Every value becomes a `pub const` of `&'static str`, `&'static [T]`, `i64`, `f64`
# or `bool`, wrapped in `pub mod` and doc comments, plus one `include_bytes!` that binds the
# toml as a build input. None of that is `std`, so a `#![no_std]` consumer with no allocator
# gets working constants today and got them before this feature existed.
#
# Nothing in `src/` reads the flag, because there is nothing to switch. It exists so a
# workspace that turns `no_std` on across every dependency can name it here without the
# build failing on an unknown feature, and so the guarantee has somewhere to be written
# down. `tests/no_std_consumer.rs` is what holds it: it compiles a real `#![no_std]` crate
# against this one, with a control proving that crate genuinely has no `std` to fall back
# on.
#
# This crate itself is always built with `std`, on both flags. It is a proc macro, so it
# runs on the host inside the compiler and could not be `no_std` whatever it declared.
no_std = []
# The expansion allocates nothing at runtime. A `const` lives in the binary, and a
# `&'static [T]` points into it, so there is no allocation to lend and no host to lend it.
# notko's lending contract has no role here, and no test can tell this flag from `no_std`,
# because there is nothing to tell apart.
no_alloc = ["no_std"]

[dev-dependencies]
trybuild = "1.0"
tempfile = "3.19.1"

[lib]
proc-macro = true
doctest = false # unfortunately not practical to setup the doc examples with actual toml files to load or even as inlined literals for the content

[dependencies]
toml = { version = "^0.8" }
proc-macro2 = { version = "^1.0" }
quote = { version = "^1.0" }
syn = { version = "^2.0" }
globset = "^0.4"
once_cell = { version = "^1.21", features = ["std"] }

# NOTE: below metadata is for test purposes only

# this comment should end up in the metadata module's documentation string
[package.metadata]
# this comment should end up in the FOO constant's documentation string
foo = "bar"
#
#
#
# this comment should end up in the defaults module's documentation string
#
# it should handle multiline comments too
[package.metadata.defaults]
# this comment should end up in the VALUE constant's documentation string
# and also it should support multiline
# comments
value = 1
